# SGLang server flags for the disaggregated P/D recipe.
#
# Rendered by render.py into each node's `sglang.launch_server` command and the
# environment it runs with. Four sections: `defaults` and `models` (per model),
# `backends` (KV transfer, chosen by KV_TRANSFER_BACKEND) and `overlays`
# (switched on by run settings).
#
# A `defaults` or `models` entry mirrors madengine's serve-flag map (base ->
# modes -> roles), so it can move into a mad-config.yaml unchanged if madengine
# starts applying it:
#
#   base:                        flags for every role and mode
#   env:                         environment for every role and mode
#   modes: {tp, wide_ep}         one parallelism mode, both roles
#   roles: {prefill, decode}     one role; `--flag` keys apply to every mode,
#                                `tp:` / `wide_ep:` sub-blocks to one mode
#   extends: <model>             start from another model's entry
#
# Any mode, role or role x mode block may also hold an `env:` map; environment
# layers in the same order as flags.
#
# Precedence, lowest first: `defaults`, then the model (each resolved base ->
# mode -> role -> role x mode), then the KV backend's `args`, then
# `overlays`, then EXTRA_SERVER_ARGS / EXTRA_<ROLE>_ARGS. A later layer replaces
# a flag's value; `false` or `null` removes the flag. Under `extends`, a `null`
# instead drops the value inherited from the parent entry. For `env`, a `null`
# removes the variable, and anything already in the environment (a run setting
# or the cluster profile) wins.
#
# Values: `true` is a bare flag, a list is several values, and "A..B" expands to
# the integers A through B. Quote env values: they are passed as strings.
#
# A model may run PARALLEL_MODE=wide_ep only if its own entry has a
# `modes.wide_ep` block. The launcher owns topology and transport flags
# (--model-path, --disaggregation-mode, --host, --port, --tp-size, --dp-size,
# --ep-size, --nnodes, --node-rank, --dist-init-addr, --disaggregation-ib-device);
# do not set them here.

defaults:
  env:
    # Disaggregation handshakes can take minutes on a cold multi-node start.
    SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "1200"
    SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "1200"
  base:
    --attention-backend: aiter
    --watchdog-timeout: 1000000
    --mem-fraction-static: 0.73
    --trust-remote-code: true
    --decode-log-interval: 1
    --log-level-http: warning
  modes:
    tp:
      --load-balance-method: round_robin
    wide_ep:
      # Pins each request to the DP rank owning its bootstrap slot; without it
      # KV transfers land on the wrong rank and requests hang.
      --load-balance-method: follow_bootstrap_room
      env:
        # MoRI expert-parallel dispatch and combine. SGLang v0.5.2x reads
        # SGLANG_MORI_DISPATCH_DTYPE / SGLANG_MORI_COMBINE_DTYPE instead of the
        # three *_DISP / *_COMB names; `render.py check` reports them.
        SGLANG_MORI_FP8_DISP: "True"
        SGLANG_MORI_FP4_DISP: "False"
        SGLANG_MORI_FP8_COMB: "False"
        SGLANG_MORI_DISPATCH_INTER_KERNEL_SWITCH_THRESHOLD: "320"
        # The 4 GiB default heap is too small at EP >= 32.
        MORI_SHMEM_HEAP_SIZE: "17179869184"
  roles:
    prefill:
      tp:
        --disable-cuda-graph: true
    decode:
      tp:
        # Perf sweeps measure cache-free throughput; the radix_cache overlay
        # turns the cache back on for the agentic benchmark.
        --disable-radix-cache: true
        --cuda-graph-bs-decode: 1..512
      wide_ep:
        env:
          SGLANG_MORI_NUM_MAX_DISPATCH_TOKENS_PER_RANK: "160"

# KV-cache transfer backends (KV_TRANSFER_BACKEND). `modes` lists the
# PARALLEL_MODEs each has been validated with; other combinations are refused.
backends:
  mori:
    modes: [tp, wide_ep]
    args:
      --disaggregation-transfer-backend: mori
  mooncake:
    modes: [tp]
    args:
      --disaggregation-transfer-backend: mooncake

overlays:
  radix_cache:
    --disable-radix-cache: false
  server_metrics:
    --enable-metrics: true
    --enable-metrics-for-all-schedulers: true

models:
  Llama-3.1-8B-Instruct: {}

  Qwen3-32B: {}

  Mixtral-8x7B-Instruct-v0.1: {}

  amd-Llama-3.3-70B-Instruct-FP8-KV:
    base:
      --mem-fraction-static: 0.65

  Llama-3.1-405B-Instruct-FP8-KV:
    base:
      --mem-fraction-static: 0.65
    roles:
      prefill:
        tp:
          --disable-radix-cache: true
      decode:
        tp:
          --cuda-graph-bs-decode: 1..8

  DeepSeek-V3:
    modes:
      wide_ep:
        --moe-a2a-backend: mori
        --enable-dp-attention: true
        --enable-dp-lm-head: true
        --moe-dense-tp-size: 1
        # Forces all DP ranks to step together so idle ranks enter the MoRI EP collective.
        --enable-dp-attention-local-control-broadcast: true
        --max-running-requests: 8192
    roles:
      prefill:
        wide_ep:
          --cuda-graph-bs-decode: 1..3
          --mem-fraction-static: 0.65
      decode:
        wide_ep:
          --cuda-graph-bs-decode: [1, 2, 4, 8, 16, 24, 32, 48, 64, 96, 128]

  DeepSeek-R1:
    extends: DeepSeek-V3
    roles:
      prefill:
        wide_ep:
          # R1 has been run at the default fraction, unlike V3.
          --mem-fraction-static: null
